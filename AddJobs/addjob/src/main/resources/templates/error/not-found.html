<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/master :: page('Not Found', ~{::section})}">
<section>
    <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <h1>Page Not Found</h1>
        <p th:text="${message} ?: 'The page you are looking for does not exist.'">Not found</p>
        <a th:href="@{/}" class="btn btn-primary">Go to Homepage</a>
    </div>
</section>
</html>

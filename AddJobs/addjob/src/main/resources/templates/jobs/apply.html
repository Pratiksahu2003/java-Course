<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/master :: page('Apply - ' + ${job.title}, ~{::section})}">
<section>
    <div class="breadcrumb">
        <a th:href="@{/}">Jobs</a>
        <span>/</span>
        <a th:href="@{/jobs/{id}(id=${job.id})}" th:text="${job.title}">Job</a>
        <span>/</span>
        <span>Apply</span>
    </div>

    <div class="apply-header">
        <h1>Apply for <span th:text="${job.title}">Job Title</span></h1>
        <p class="subtitle" th:text="${job.company} + ' · ' + ${job.location}">Company · Location</p>
    </div>

    <form th:action="@{/jobs/{jobId}/apply(jobId=${job.id})}"
          th:object="${applicationForm}"
          method="post"
          enctype="multipart/form-data"
          class="form-card"
          novalidate>

        <h2 class="form-section-title">Personal Information</h2>

        <div class="form-group">
            <label for="fullName">Full Name <span class="required">*</span></label>
            <input type="text" id="fullName" th:field="*{fullName}" placeholder="Your full name"
                   th:classappend="${#fields.hasErrors('fullName')} ? 'input-error' : ''"/>
            <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" th:field="*{email}" placeholder="you@example.com"
                       th:classappend="${#fields.hasErrors('email')} ? 'input-error' : ''"/>
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number <span class="required">*</span></label>
                <input type="tel" id="phone" th:field="*{phone}" placeholder="+91 98765 43210"
                       th:classappend="${#fields.hasErrors('phone')} ? 'input-error' : ''"/>
                <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>
        </div>

        <div class="form-group">
            <label for="linkedIn">LinkedIn Profile <span class="optional">(optional)</span></label>
            <input type="url" id="linkedIn" th:field="*{linkedIn}" placeholder="https://linkedin.com/in/yourprofile"
                   th:classappend="${#fields.hasErrors('linkedIn')} ? 'input-error' : ''"/>
            <span class="field-error" th:if="${#fields.hasErrors('linkedIn')}" th:errors="*{linkedIn}"></span>
        </div>

        <h2 class="form-section-title">Application Details</h2>

        <div class="form-group">
            <label for="coverLetter">Cover Letter <span class="optional">(optional)</span></label>
            <textarea id="coverLetter" th:field="*{coverLetter}" rows="6"
                      placeholder="Tell us why you're a great fit for this role..."
                      th:classappend="${#fields.hasErrors('coverLetter')} ? 'input-error' : ''"></textarea>
            <span class="field-hint">Max 2000 characters</span>
            <span class="field-error" th:if="${#fields.hasErrors('coverLetter')}" th:errors="*{coverLetter}"></span>
        </div>

        <div class="form-group">
            <label for="resume">Resume <span class="optional">(optional)</span></label>
            <input type="file" id="resume" th:field="*{resume}" accept=".pdf,.doc,.docx"/>
            <span class="field-hint">PDF, DOC, or DOCX — max 5 MB</span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-lg">Submit Application</button>
            <a th:href="@{/jobs/{id}(id=${job.id})}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</section>
</html>

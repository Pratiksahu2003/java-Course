<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/master :: page('Post a Job', ~{::section})}">
<section>
    <div class="page-header">
        <div>
            <h1>Post a New Job</h1>
            <p class="subtitle">Fill in the details below to publish your job opening.</p>
        </div>
        <a th:href="@{/}" class="btn btn-outline">← Back to Jobs</a>
    </div>

    <form th:action="@{/jobs/post}" th:object="${jobPostForm}" method="post" class="form-card" novalidate>
        <div class="form-row">
            <div class="form-group">
                <label for="title">Job Title <span class="required">*</span></label>
                <input type="text" id="title" th:field="*{title}" placeholder="e.g. Senior Java Developer"
                       th:classappend="${#fields.hasErrors('title')} ? 'input-error' : ''"/>
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>
            <div class="form-group">
                <label for="company">Company <span class="required">*</span></label>
                <input type="text" id="company" th:field="*{company}" placeholder="e.g. TechVedmint"
                       th:classappend="${#fields.hasErrors('company')} ? 'input-error' : ''"/>
                <span class="field-error" th:if="${#fields.hasErrors('company')}" th:errors="*{company}"></span>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="location">Location <span class="required">*</span></label>
                <input type="text" id="location" th:field="*{location}" placeholder="e.g. Bangalore, India"
                       th:classappend="${#fields.hasErrors('location')} ? 'input-error' : ''"/>
                <span class="field-error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></span>
            </div>
            <div class="form-group">
                <label for="jobType">Job Type <span class="required">*</span></label>
                <select id="jobType" th:field="*{jobType}"
                        th:classappend="${#fields.hasErrors('jobType')} ? 'input-error' : ''">
                    <option value="">Select type</option>
                    <option th:each="type : ${jobTypes}" th:value="${type}" th:text="${type.displayName}"></option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('jobType')}" th:errors="*{jobType}"></span>
            </div>
        </div>

        <div class="form-group">
            <label for="salary">Salary / Compensation <span class="required">*</span></label>
            <input type="text" id="salary" th:field="*{salary}" placeholder="e.g. ₹8–12 LPA or $80k–$100k"
                   th:classappend="${#fields.hasErrors('salary')} ? 'input-error' : ''"/>
            <span class="field-error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>
        </div>

        <div class="form-group">
            <label for="description">Job Description <span class="required">*</span></label>
            <textarea id="description" th:field="*{description}" rows="6"
                      placeholder="Describe the role, responsibilities, and what makes this opportunity great..."
                      th:classappend="${#fields.hasErrors('description')} ? 'input-error' : ''"></textarea>
            <span class="field-hint">Minimum 50 characters</span>
            <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
        </div>

        <div class="form-group">
            <label for="requirements">Requirements <span class="required">*</span></label>
            <textarea id="requirements" th:field="*{requirements}" rows="5"
                      placeholder="List skills, experience, and qualifications required..."
                      th:classappend="${#fields.hasErrors('requirements')} ? 'input-error' : ''"></textarea>
            <span class="field-hint">Minimum 20 characters</span>
            <span class="field-error" th:if="${#fields.hasErrors('requirements')}" th:errors="*{requirements}"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-lg">Publish Job</button>
            <a th:href="@{/}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</section>
</html>

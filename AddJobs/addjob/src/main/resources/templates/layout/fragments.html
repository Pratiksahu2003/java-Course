<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Site Header -->
<header th:fragment="header" class="site-header">
    <div class="container header-inner">
        <a th:href="@{/}" class="logo">Add<span>Job</span></a>
        <nav>
            <a th:href="@{/}" class="nav-link">Browse Jobs</a>
            <a th:href="@{/jobs/post}" class="btn btn-primary btn-sm">Post a Job</a>
        </nav>
    </div>
</header>

<!-- Flash Messages -->
<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
</div>

<!-- Site Footer -->
<footer th:fragment="footer" class="site-footer">
    <div class="container">
        <p>&copy; 2026 AddJob &mdash; Post jobs. Apply easily.</p>
    </div>
</footer>

</html>
